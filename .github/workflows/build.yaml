name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python:
          - version: "3.11"
            cibuildwheel: "cp311"
            primary: true
          - version: "3.12"
            cibuildwheel: "cp312"
            primary: false
          - version: "3.13"
            cibuildwheel: "cp313"
            primary: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          version: ${{ matrix.python.version }}

      - name: Setup C++
        uses: actions-ext/cpp/setup@c2b1e90366b3a1c628a1df0748135f5e345ab26f

      - name: Setup vcpkg cache
        uses: actions-ext/cpp/setup-vcpkg-cache@c2b1e90366b3a1c628a1df0748135f5e345ab26f

      - name: Install dependencies
        run: make develop

      - name: Lint
        run: make lint
        if: matrix.os == 'ubuntu-latest' && matrix.python.primary

      - name: Checks
        run: make checks
        if: matrix.os == 'ubuntu-latest' && matrix.python.primary

      - name: Test
        run: make coverage

      - name: Upload test results (Python)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python.version }}
          path: junit.xml
        if: matrix.os == 'ubuntu-latest' && matrix.python.primary

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        with:
          files: '**/junit.xml'
        if: matrix.os == 'ubuntu-latest' && matrix.python.primary

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install build dependencies
        run: pip install cibuildwheel

      - name: Build distributions (Linux)
        run: |
          rm -rf dist
          make dist-py-sdist
          make dist-py-wheel
          make dist-check
        env:
          CIBW_BUILD: "${{ matrix.python.cibuildwheel }}-manylinux*"
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.os == 'ubuntu-latest'

      - name: Build distributions (macOS)
        run: |
          rm -rf dist
          make dist-py-wheel
        env:
          CIBW_BUILD: "${{ matrix.python.cibuildwheel }}-macos*"
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.os == 'macos-latest'

      - name: Build distributions (Windows)
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          make dist-py-wheel
        env:
          CIBW_BUILD: "${{ matrix.python.cibuildwheel }}-win_amd64"
        if: matrix.os == 'windows-latest'

      - name: Test wheel
        uses: actions-ext/python/test-wheel@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          module: python_template_cpp
        if: matrix.os == 'ubuntu-latest'

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          module: python_template_cpp
        if: matrix.os == 'ubuntu-latest'

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{matrix.os}}-${{matrix.python.version}}
          path: dist
