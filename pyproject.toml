[build-system]
requires = [
    "hatchling",
    "hatch-cpp>=0.6.0",
    "pybind11",
]
build-backend = "hatchling.build"

[project]
name = "python-template-cpp"
authors = [
    {name = "Python Project Template Authors", email = "3105306+timkpaine@users.noreply.github.com"},
]
description = "A C++-Python project template"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "cibuildwheel",
    "codespell",
    "hatch-cpp>=0.6.0",
    "hatchling",
    "mdformat",
    "mdformat-myst",
    "mdformat-tables>=1",
    "pybind11",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.scripts]

[project.urls]
Repository = "https://github.com/python-project-templates/python-template-cpp"
Homepage = "https://github.com/python-project-templates/python-template-cpp"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "python_template_cpp/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "cpp/CMakeLists.txt"
search = "VERSION {current_version}"
replace = "VERSION {new_version}"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
test-command = "pytest -vvv {project}/python_template_cpp/tests"
test-extras = "develop"

[tool.cibuildwheel.linux]
manylinux-aarch64-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
skip = "*i686* *musllinux*"
# Keep the bundled C ABI library where the extension's rpath expects it.
repair-wheel-command = "auditwheel repair --exclude 'libpython_template_cpp.so' -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET="11.0"}
archs = "arm64"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} --exclude libpython_template_cpp.dylib -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = "AMD64"
skip = "*win32 *arm64"
# The C ABI library ships inside the wheel; delvewheel must not look for it on PATH.
repair-wheel-command = "delvewheel repair --exclude libpython_template_cpp.dll -w {dest_dir} {wheel}"

[tool.cibuildwheel.pyodide]
test-command = "python -m pytest -vvv --pyargs python_template_cpp.tests"
test-extras = []
test-requires = ["pytest"]
# Emscripten has no shared libraries to split; compile the library in.
environment = {HATCH_CPP_LIBRARY_SOURCE="direct"}

[tool.coverage.run]
branch = true
omit = [
    "python_template_cpp/tests/integration/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.hooks.hatch-cpp]
verbose = true

# libpython_template_cpp: the C ABI library, shipped under python_template_cpp/lib. Its header is in python_template_cpp/include.
[[tool.hatch.build.hooks.hatch-cpp.libraries]]
name = "python_template_cpp/lib/libpython_template_cpp"
sources = ["cpp/python-template-cpp/c_api.cpp", "cpp/python-template-cpp/example.cpp"]
include-dirs = ["cpp", "python_template_cpp/include"]
binding = "generic"
define-macros = ["PYTHON_TEMPLATE_CPP_BUILD"]
extra-compile-args-linux = ["-fvisibility=hidden"]
extra-compile-args-darwin = ["-fvisibility=hidden"]
expected-headers = ["python_template_cpp/include/python_template_cpp/python_template_cpp.h"]
header-symbol-prefix = "python_template_cpp_"
expected-abi-strings = ["PYTHON_TEMPLATE_CPP_ABI_VERSION 1"]

# The pybind11 extension, linked against the library by default (library-source = bundled).
[[tool.hatch.build.hooks.hatch-cpp.libraries]]
name = "python_template_cpp/extension"
sources = ["cpp/python/extension.cpp"]
include-dirs = ["python_template_cpp/include"]
binding = "pybind11"
depends = ["python_template_cpp/lib/libpython_template_cpp"]

[tool.hatch.build.targets.sdist]
exclude = ["*.dll", "*.dylib", "*.so", "*.pyd"]
packages = [
    "python_template_cpp",
    "cpp",
]

[tool.hatch.build.targets.sdist.force-include]
"vcpkg.json" = "vcpkg.json"
"vcpkg-overlays" = "vcpkg-overlays"


[tool.hatch.build.targets.wheel]
artifacts = [
    "python_template_cpp/*.dll",
    "python_template_cpp/*.dylib",
    "python_template_cpp/*.so",
    "python_template_cpp/lib/*",
]
packages = [
    "python_template_cpp",
]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "python_template_cpp/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "python_template_cpp",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "python template cpp"
root = "README.md"
pages = []
use-autoapi = true

